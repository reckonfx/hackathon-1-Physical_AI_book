<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <style>
    .node { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2px; rx: 10px; }
    .label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #757575; stroke-width: 2px; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#757575" />
    </marker>
  </defs>

  <!-- Voice Input -->
  <rect x="50" y="50" width="120" height="60" class="node"/>
  <text x="110" y="80" class="label">Voice Input</text>

  <!-- Whisper Processing -->
  <rect x="220" y="50" width="120" height="60" class="node"/>
  <text x="280" y="80" class="label">Whisper</text>
  <text x="280" y="100" class="label">(Speech to Text)</text>

  <!-- LLM Processing -->
  <rect x="390" y="50" width="120" height="60" class="node"/>
  <text x="450" y="80" class="label">LLM</text>
  <text x="450" y="100" class="label">(Cognitive Planning)</text>

  <!-- ROS 2 Action -->
  <rect x="560" y="50" width="120" height="60" class="node"/>
  <text x="620" y="80" class="label">ROS 2</text>
  <text x="620" y="100" class="label">(Action Sequences)</text>

  <!-- Robot Execution -->
  <rect x="390" y="200" width="120" height="60" class="node"/>
  <text x="450" y="230" class="label">Robot</text>
  <text x="450" y="250" class="label">(Execution)</text>

  <!-- Arrows -->
  <line x1="170" y1="80" x2="220" y2="80" class="arrow"/>
  <line x1="340" y1="80" x2="390" y2="80" class="arrow"/>
  <line x1="510" y1="80" x2="560" y2="80" class="arrow"/>
  <line x1="450" y1="110" x2="450" y2="200" class="arrow"/>
  <line x1="450" y1="260" x2="450" y2="320" class="arrow"/>

  <!-- Feedback Loop -->
  <text x="450" y="350" class="label">Feedback</text>
  <line x1="450" y1="370" x2="450" y2="400" class="arrow"/>
  <line x1="450" y1="400" x2="110" y2="400" class="arrow"/>
  <line x1="110" y1="400" x2="110" y2="110" class="arrow"/>

  <text x="400" y="500" class="label">VLA Pipeline: Voice to Action Translation</text>
</svg>