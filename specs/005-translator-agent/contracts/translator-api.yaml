openapi: 3.0.0
info:
  title: TranslatorAgent API
  description: API for translating book content to different languages
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
paths:
  /translate:
    post:
      summary: Translate text to a target language
      description: Translates source text to the specified target language with optional automatic source language detection
      operationId: translateText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationRequest'
      responses:
        '200':
          description: Successful translation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - api_key: []
  /detect-language:
    post:
      summary: Detect the language of input text
      description: Automatically detects the language of the provided text
      operationId: detectLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageDetectionRequest'
      responses:
        '200':
          description: Successful language detection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageDetectionResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - api_key: []
components:
  schemas:
    TranslationRequest:
      type: object
      required:
        - text
        - target_language
      properties:
        text:
          type: string
          description: The source text to be translated (max 1000 characters)
          maxLength: 1000
          example: "The robot moved through the environment using SLAM algorithms."
        target_language:
          type: string
          description: The language code to translate to (ISO 639-1)
          pattern: "^[a-z]{2}$"
          example: "es"
        source_language:
          type: string
          description: The language code of the source text (ISO 639-1), if not provided auto-detect
          pattern: "^[a-z]{2}$"
          example: "en"
        preserve_formatting:
          type: boolean
          description: Whether to attempt to preserve original formatting
          default: true
        glossary_ref:
          type: boolean
          description: Whether to include glossary references for technical terms
          default: false
    TranslationResponse:
      type: object
      required:
        - translated_text
        - target_language
        - char_count
        - processing_time
      properties:
        translated_text:
          type: string
          description: The translated text content
          example: "El robot se movió a través del entorno utilizando algoritmos SLAM."
        detected_source_language:
          type: string
          description: The detected source language code (ISO 639-1)
          pattern: "^[a-z]{2}$"
          example: "en"
        target_language:
          type: string
          description: The target language code (ISO 639-1)
          pattern: "^[a-z]{2}$"
          example: "es"
        confidence:
          type: number
          description: Confidence score of the translation (0-1)
          format: float
          minimum: 0
          maximum: 1
          example: 0.92
        technical_terms:
          type: array
          description: List of technical terms preserved in original form
          items:
            type: string
          example: ["SLAM", "robot"]
        char_count:
          type: number
          description: Character count of original text
          example: 54
        processing_time:
          type: number
          description: Time taken to process the request in milliseconds
          example: 1250
    LanguageDetectionRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The text to analyze for language detection (max 1000 characters)
          maxLength: 1000
          example: "The robot moved through the environment using SLAM algorithms."
    LanguageDetectionResponse:
      type: object
      required:
        - detected_language
        - char_count
      properties:
        detected_language:
          type: string
          description: The detected language code (ISO 639-1)
          pattern: "^[a-z]{2}$"
          example: "en"
        confidence:
          type: number
          description: Confidence score of the detection (0-1)
          format: float
          minimum: 0
          maximum: 1
          example: 0.98
        all_matches:
          type: array
          description: Array of all possible language matches with confidence scores
          items:
            $ref: '#/components/schemas/LanguageMatch'
        char_count:
          type: number
          description: Character count of input text
          example: 54
    LanguageMatch:
      type: object
      required:
        - language
        - confidence
      properties:
        language:
          type: string
          description: The language code (ISO 639-1)
          pattern: "^[a-z]{2}$"
          example: "en"
        confidence:
          type: number
          description: Confidence score of the detection (0-1)
          format: float
          minimum: 0
          maximum: 1
          example: 0.98
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "TRANSLATION_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "Translation service unavailable"
        details:
          type: object
          description: Additional error details
          example: {"api_limit": "Rate limit exceeded, please try again later"}
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for rate limiting and access control (not for translation service)