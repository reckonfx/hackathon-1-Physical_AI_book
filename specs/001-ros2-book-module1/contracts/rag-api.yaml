openapi: 3.0.0
info:
  title: Physical AI Book RAG API
  description: API for retrieval-augmented generation functionality for the Physical AI Book
  version: 1.0.0
paths:
  /api/search:
    post:
      summary: Search book content for relevant passages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Search query
                max_results:
                  type: integer
                  description: Maximum number of results to return
                  default: 5
                module_filter:
                  type: string
                  description: Optional filter for specific module
              required:
                - query
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        content:
                          type: string
                          description: The relevant content chunk
                        source:
                          type: string
                          description: Source location (module/lesson/section)
                        score:
                          type: number
                          description: Relevance score
                        chunk_size:
                          type: integer
                          description: Size of the content chunk
  /api/validate-content:
    post:
      summary: Validate content for RAG optimization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Content to validate
                min_chunk_size:
                  type: integer
                  default: 500
                max_chunk_size:
                  type: integer
                  default: 1200
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_valid:
                    type: boolean
                  suggestions:
                    type: array
                    items:
                      type: string
                  chunk_size:
                    type: integer