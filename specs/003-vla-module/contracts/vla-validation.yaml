openapi: 3.0.0
info:
  title: VLA Validation API
  description: API for validating Vision-Language-Action examples and content in the VLA module
  version: 1.0.0
paths:
  /api/validate-vla:
    post:
      summary: Validate VLA examples for correctness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                simulation_type:
                  type: string
                  description: Type of VLA validation (voice-processing, llm-integration, cognitive-planning, capstone)
                example_path:
                  type: string
                  description: Path to the VLA example
                validation_criteria:
                  type: array
                  items:
                    type: string
                  description: Specific criteria to validate
              required:
                - simulation_type
                - example_path
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_valid:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                  suggestions:
                    type: array
                    items:
                      type: string
  /api/vla-examples:
    get:
      summary: Get available VLA examples
      parameters:
        - name: environment
          in: query
          description: Filter by simulation environment (vla, simulation, ros2)
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: Filter by example type (voice-processing, llm-integration, cognitive-planning, capstone)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of available VLA examples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    environment:
                      type: string
                    type:
                      type: string
                    description:
                      type: string
                    lesson:
                      type: string